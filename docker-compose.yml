services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DAILY_LLM_CAP=${DAILY_LLM_CAP:-1000}
      # Rate limiting keys on the client IP our edge proxy appends to
      # X-Forwarded-For. Set CLIENT_IP_HEADER instead if the edge proxy
      # overwrites a dedicated header (e.g. cf-connecting-ip behind Cloudflare).
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
      - CORS_ORIGINS=http://localhost:3737,http://web:3737
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./apps/api/spice:/app/spice
      - ./packages:/packages
      - spice-data:/app/spice/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_UMAMI_URL: ${UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    ports:
      - "3737:3737"
    environment:
      - API_URL=http://api:5000
      - NEXT_PUBLIC_UMAMI_URL=${UMAMI_URL:-}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-replace-me-with-a-random-string}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  umami-db:
    image: postgres:15-alpine
    volumes:
      - umami-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  spice-data:
  umami-data:
