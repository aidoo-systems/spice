name: CI

on:
  pull_request:
  push:
    branches-ignore: [master] # master runs this via deploy.yml
  workflow_dispatch:
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API deps
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run API tests
        run: PYTHONPATH="../../packages:." python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e

  # Runs the fixed eval set against the real model. Skipped (green) when the
  # repository has no OPENAI_API_KEY secret, e.g. on forks.
  evals:
    runs-on: ubuntu-latest
    needs: api
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        if: env.OPENAI_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.OPENAI_API_KEY != ''
        with:
          python-version: "3.11"
      - name: Install API deps
        if: env.OPENAI_API_KEY != ''
        run: pip install -r requirements.txt
      - name: Run evals
        if: env.OPENAI_API_KEY != ''
        run: PYTHONPATH="../../packages:." python -m evals.run --min-pass 0.9 --report eval-report.json
      - uses: actions/upload-artifact@v4
        if: always() && env.OPENAI_API_KEY != ''
        with:
          name: eval-report
          path: apps/api/eval-report.json
          if-no-files-found: ignore
