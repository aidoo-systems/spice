name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/spice
            git pull origin master
            docker compose up -d --build
            curl -fsS http://localhost:5000/health > /dev/null
            curl -fsS http://localhost:3737/robots.txt > /dev/null
            curl -fsS http://localhost:3737/sitemap.xml > /dev/null
            docker image prune -f

      - name: External smoke checks
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors https://spice.aidoo.biz/ > /dev/null
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors https://spice.aidoo.biz/robots.txt > /dev/null
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors https://spice.aidoo.biz/sitemap.xml > /dev/null
